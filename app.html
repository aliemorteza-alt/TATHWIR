<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tathwir</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B0C26">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tathwir">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Montserrat:wght@600;700;800&family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root{box-sizing:border-box;color-scheme:dark;
  --bg:#0b0c26;--surface:#151833;--ink:#f2f4ff;--muted:#a9b0d6;--line:#2a2f5c;
  --ac:#c9b8ff;--ac-soft:rgba(124,58,237,.2);--grad:linear-gradient(90deg,#2563eb,#7c3aed);
  --bad:#ff9a9a;--bad-soft:rgba(255,107,107,.15);
  --green:#4ade80;--green-soft:rgba(74,222,128,.14);--amber:#fbbf24;--amber-soft:rgba(251,191,36,.14);--blue:#8ab0ff;--blue-soft:rgba(138,176,255,.16);
  --ar:"Amiri","Noto Naskh Arabic","Scheherazade New","DejaVu Sans",serif;
  --hd:Montserrat,system-ui,sans-serif;--ui:Mulish,system-ui,-apple-system,"Segoe UI",sans-serif}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--ui)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--hd)}
h1{font-size:24px;font-weight:700;margin-bottom:4px}
h2{font-size:16px;font-weight:600}
h3{font-size:15px;font-weight:700}
p{margin:0}
.sub{color:var(--muted);margin:0 0 18px;max-width:64ch}
.ar,[lang=ar]{font-family:var(--ar)}
.top{position:sticky;top:0;z-index:20;background:rgba(11,12,38,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px 20px;flex-wrap:wrap}
.brand{font:700 17px var(--hd);display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand i{display:block;height:30px;font-style:normal}
.brand i svg{display:block;height:100%;width:auto;fill:url(#twg)}
.rep .brand i svg{fill:url(#twg2)}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;margin-left:auto}
.seg button{border:0;background:none;padding:6px 14px;border-radius:8px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--grad);color:#fff}
.who{color:var(--muted);font-weight:600;font-size:14px}
.shell{display:flex;max-width:1280px;margin:0 auto}
.side{width:220px;flex:none;padding:18px 12px;position:sticky;top:58px;align-self:flex-start}
.side a{display:block;padding:9px 12px;border-radius:9px;color:var(--muted);font-weight:600;cursor:pointer;text-decoration:none;margin-bottom:2px}
.side a:hover{background:var(--surface)}
.side a.on{background:var(--ac-soft);color:var(--ac)}
.page{flex:1;min-width:0;padding:22px 22px 80px}
.back{background:none;border:0;color:var(--ac);font-weight:700;cursor:pointer;padding:0;margin-bottom:12px}
/* tombol */
.btn{display:inline-block;border:0;border-radius:9px;padding:9px 16px;font-weight:700;cursor:pointer;background:var(--grad);color:#fff;text-decoration:none;line-height:1.3}
.btn:hover{filter:brightness(1.12)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.line{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.line:hover{background:var(--bg);filter:none}
.btn.bad{background:var(--surface);color:var(--bad);border:1px solid var(--line)}
.btn.bad:hover{background:var(--bad-soft);filter:none}
.btn.sm{padding:5px 11px;font-size:13px}
/* status = pill */
.st{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.st.ok{background:var(--green-soft);color:var(--green);border-color:transparent}
.st.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.st.warn{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.st.ready{background:var(--blue-soft);color:var(--blue);border-color:transparent}
/* daftar pekan */
.tr{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer}
.tr:hover:not(:disabled){border-color:var(--ac)}
.tr:disabled{cursor:not-allowed;opacity:.6}
.ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--ac-soft);color:var(--ac);font-weight:800;flex:none}
.ico.ok{background:var(--green-soft);color:var(--green)}
.tr .g{flex:1;min-width:0;display:block}
.tr .nm{display:block;font:700 16px var(--hd)}
.tr .nm .ar{font-size:21px;font-weight:400;color:var(--muted);margin-left:10px}
.tr .ds{display:block;color:var(--muted);margin-top:2px}
.tr .rt{display:flex;flex-direction:column;gap:4px;align-items:flex-end;text-align:right}
.tr .rt small{color:var(--muted);font-size:12.5px}
.empty{border:1px dashed var(--line);border-radius:12px;padding:26px;color:var(--muted);background:var(--surface)}
/* halaman pekan */
.ph{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.ph .ar{font-size:30px;color:var(--muted)}
.meta{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:8px 0 0;color:var(--muted);font-size:14px}
.sec{margin-top:28px}
.sec>h2{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.sec>h2 small{font-size:13px;font-weight:600;color:var(--muted);font-family:var(--ui)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:0 0 14px;max-width:340px}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .4s}
.vrow{display:grid;grid-template-columns:260px 1fr;gap:6px 18px;padding:14px;margin-bottom:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.vbox{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,#1c2150,#4c2fa8);border-radius:12px;overflow:hidden}
.vbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vbox.empty{display:grid;place-items:center;color:#dcd6ff;font-size:13px;text-align:center;padding:10px;border:0}
.vplay{position:absolute;inset:0;border:0;padding:0;background:none;cursor:pointer}
.vplay img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vplay .tri{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(0,0,0,.65)}
.vplay .tri::before{content:"";position:absolute;left:21px;top:16px;border-style:solid;border-width:11px 0 11px 18px;border-color:transparent transparent transparent #fff}
.vlink{display:grid;place-items:center;aspect-ratio:16/9;border-radius:12px;background:#0b0c26;border:1px solid var(--line);color:#fff;font-weight:700;text-decoration:none;padding:12px;text-align:center}
.vinfo h3{margin-bottom:4px}.vinfo p{color:var(--muted)}
.vinfo .act{margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lock{background:var(--ac-soft);color:var(--ac);border-radius:10px;padding:14px;font-weight:700;text-align:center}
/* form catatan */
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 18px 20px;margin:14px 0}
.sh{display:flex;align-items:baseline;gap:10px;padding-top:18px;margin-bottom:6px;flex-wrap:wrap}
.sh .arh{font-size:22px;color:var(--muted)}
.sh p{color:var(--muted);font-size:13px;margin-left:auto}
.wh,.wr,.ur{display:grid;grid-template-columns:1fr 1fr auto;gap:0 10px;align-items:start}
.wh{font-size:12px;color:var(--muted);font-weight:700;padding:6px 0 4px}
.wh span:nth-child(2){text-align:right}
.wr,.ur{margin-bottom:8px}
.wr input,.ur textarea,.ruled{display:block;width:100%;min-width:0;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}
.wr input.arf,.ur textarea.arf{font-family:var(--ar);font-size:23px;direction:rtl;text-align:right;line-height:1.5;padding:4px 11px}
.ur textarea{resize:vertical;min-height:46px;height:46px}
.ctl{display:flex;gap:6px;align-items:center;height:42px}
.ctl select{border:1px solid var(--line);border-radius:8px;background:var(--surface);height:30px;font-size:13px;max-width:92px}
.ctl .x{border:0;background:none;color:var(--muted);font-size:22px;line-height:1;cursor:pointer;width:28px;height:28px;border-radius:6px}
.ctl .x:hover{background:var(--bad-soft);color:var(--bad)}
.addrow{margin-top:4px}
.ruled{resize:vertical;min-height:130px;line-height:1.6}
.req{list-style:none;margin:18px 0 14px;padding:0;display:grid;gap:4px}
.req li{display:flex;gap:10px;align-items:baseline;color:var(--muted);font-size:14px}
.req li::before{content:"○";font-weight:800}
.req li.ok{color:var(--green)}.req li.ok::before{content:"✓"}
.done{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:6px 0 14px}
.notes{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 18px 16px}
/* tabel */
.tb{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:20px}
table{width:100%;border-collapse:collapse;min-width:560px}
th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:700}
td.arc{font-family:var(--ar);font-size:22px;direction:rtl;text-align:right}
th.arc{text-align:right}
tr:last-child td{border-bottom:0}
th.no,td.no{width:44px}
.kh{white-space:pre-wrap;line-height:1.8;border-left:3px solid var(--ac);padding-left:14px}
.none{color:var(--muted);font-size:14px}
.notes h3,.rep h3{margin:18px 0 8px;display:flex;gap:10px;align-items:baseline}
.notes h3 .ar,.rep h3 .ar{font-size:21px;color:var(--muted);font-weight:400}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px}
.k{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.k small{display:block;color:var(--muted);font-weight:600}
.k b{display:block;font:700 26px var(--hd);margin-top:2px}
.fm{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:20px;max-width:760px}
.fm h2{margin-bottom:12px}
.fm label,.gbox label{display:block;font-weight:700;font-size:13px;margin-bottom:12px}
.fm input,.fm select,.fm textarea,.gbox input{display:block;width:100%;margin-top:5px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);font-weight:400}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.filters input,.filters select{border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:8px 11px;min-width:150px}
.note{background:var(--amber-soft);color:var(--amber);border-radius:10px;padding:10px 14px;font-weight:600;margin-bottom:16px}
.note code{font-weight:700}
.row-act{white-space:nowrap;display:flex;gap:6px;flex-wrap:wrap}
/* overlay */
.ov{position:fixed;inset:0;z-index:60;background:rgba(5,6,20,.72);display:grid;place-items:center;padding:20px;overflow:auto}
.ov[hidden]{display:none}
.gbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;max-width:420px;width:100%}
.gbox h2{font-size:20px;margin-bottom:6px}.gbox p{color:var(--muted);margin-bottom:14px}
#rep{background:var(--bg);place-items:start center}
#rep .acts{position:sticky;top:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);padding:10px 14px;border-radius:12px;margin-bottom:14px;width:100%;max-width:820px;z-index:2}
#rep .acts span{color:var(--muted);font-size:13px}
#rep .wrap{width:100%;max-width:820px}
/* laporan selalu terang, juga saat mode gelap */
.rep{--surface:#fff;--ink:#14162e;--muted:#5a6182;--line:#dfe3f2;--bg:#f4f5fb;--ac:#4f46e5;
  background:#fff;color:#14162e;border:1px solid var(--line);border-radius:12px;padding:34px 40px}
.rep .rh{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;border-bottom:2px solid #14162e;padding-bottom:14px;margin-bottom:16px}
.rep .rh h1{font-size:22px;margin-bottom:2px}
.rep .m{color:#5a6182;font-size:13.5px}
.rep .brand{color:#14162e;flex:none}
.rep tr{break-inside:avoid}
.rep table{min-width:0}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#2a2f5c;color:#fff;padding:11px 18px;border-radius:10px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:860px){
  .shell{display:block}
  .side{position:static;width:auto;display:flex;gap:4px;overflow-x:auto;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
  .side a{white-space:nowrap;margin:0}
  .page{padding:18px 14px 80px}
  .vrow{grid-template-columns:1fr}
  .two,.three{grid-template-columns:1fr}
  .who{display:none}
}
@media (max-width:560px){.ctl select{display:none}.wh,.wr,.ur{grid-template-columns:1fr 1fr 34px;gap:0 6px}.sheet{padding:4px 12px 18px}.tr{flex-wrap:wrap}.tr .rt{flex-direction:row;align-items:center;gap:10px;width:100%;text-align:left}.rep{padding:22px 18px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
@media print{
  :root{color-scheme:light}
  html,body.printing{background:#fff!important}
  body.printing>*:not(#rep){display:none!important}
  body.printing #rep{position:static;display:block;background:#fff;padding:0;overflow:visible;height:auto;min-height:0}
  body.printing #rep .wrap{display:block;height:auto}
  #rep .acts{display:none!important}
  #rep .wrap{max-width:none}
  .rep{border:0;padding:0;border-radius:0;box-sizing:border-box;width:100%;max-width:100%;min-width:0}
  .rep .rh .brand{flex:none}
  .rep .tb{overflow:visible}
  @page{size:A4;margin:16mm}
}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.sc{margin-bottom:14px}
.sc h2{margin-bottom:10px}
.sc h2 small{font-size:13px;font-weight:600;color:var(--muted);font-family:var(--ui);margin-left:6px}
.sh3{margin:14px 0 8px;font-size:14px}
.hint{color:var(--muted);font-size:13px;margin:0 0 10px}
.act{margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stp{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 0;border-bottom:1px solid var(--line)}
.stp:last-child{border-bottom:0}.stp b{flex:1;min-width:150px;font-weight:600}
.ent{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--bg)}
.ent .eh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:700;font-size:13px;color:var(--muted)}
.ent .x{border:0;background:none;color:var(--muted);font-size:22px;line-height:1;cursor:pointer;width:28px;height:28px;border-radius:6px}
.ent .x:hover{background:var(--bad-soft);color:var(--bad)}
.ent label{display:block;font-weight:700;font-size:12.5px;color:var(--muted);margin-bottom:8px}
.ent input,.ent textarea{display:block;width:100%;margin-top:4px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);font-weight:400;font-size:15px}
.ent textarea{resize:vertical}
.ent .arf{font-family:var(--ar);font-size:23px;direction:rtl;text-align:right;line-height:1.5;padding:4px 11px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;direction:rtl}
.f3 label{direction:ltr;text-align:left}
.qq{margin:0 0 16px}.qq p{font-weight:700;margin:0 0 8px}
.opt{display:flex;gap:9px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line);border-radius:9px;margin-bottom:6px;cursor:pointer}
.opt input{margin-top:3px;accent-color:#7c3aed}
.qe{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.qe textarea,.qe input[type=text]{display:block;width:100%;margin-top:5px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:inherit}
.qe .oo{display:flex;gap:8px;align-items:center;margin-top:8px}.qe .oo input[type=text]{margin-top:0}
.qe .oo input[type=radio]{accent-color:#7c3aed;width:18px;height:18px;flex:none}
label.f{display:block;font-weight:700;font-size:13px;margin-bottom:12px}
label.f select{display:block;width:100%;margin-top:5px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}
.tr.static{cursor:default}.tr.static:hover{border-color:var(--line)}
.tr .row-act{justify-content:flex-end}
h3.mf{font-family:var(--hd);font-size:17px;margin:22px 0 4px;padding-bottom:6px;border-bottom:1px solid var(--line);display:block}
.rep .rl{margin-top:26px}
.rep .rl h2{font-size:18px;padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:6px;break-after:avoid}
.rep .rl a{color:#4f46e5;word-break:break-all}
@media (max-width:560px){.f2{grid-template-columns:1fr}.f3{gap:6px}}

fieldset.steps{border:1px solid var(--line);border-radius:12px;padding:12px 14px 14px;margin:0 0 16px}
fieldset.steps legend{font-weight:700;font-size:13px;padding:0 6px}
.chk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fm .ck,.ck{display:flex!important;flex-direction:row!important;align-items:center;gap:8px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);cursor:pointer;font-weight:600;font-size:14px;margin:0}
.ck input{width:18px;height:18px;margin:0;accent-color:#7c3aed;flex:none}
@media (max-width:560px){.chk{grid-template-columns:1fr 1fr}}

.hb{display:none;flex-direction:column;justify-content:center;align-items:center;gap:4px;width:40px;height:40px;border:1px solid var(--line);background:var(--bg);border-radius:10px;cursor:pointer;padding:0}
.hb.show{display:flex}.hb i{display:block;width:18px;height:2px;background:var(--ink);border-radius:2px}
.hb:hover,.hb[aria-expanded=true]{border-color:var(--ac)}
.mm{position:absolute;right:20px;top:100%;margin-top:6px;width:240px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:0 14px 36px rgba(0,0,0,.45);z-index:40}
.mm[hidden]{display:none}
.mm .who2{padding:8px 12px 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.mm .who2 b{display:block;font-family:var(--hd);font-size:14px}.mm .who2 span{color:var(--muted);font-size:12.5px;word-break:break-all}
.mm a,.mm button{display:block;width:100%;text-align:left;padding:10px 12px;border:0;background:none;border-radius:9px;color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.mm a:hover,.mm button:hover{background:var(--ac-soft)}
.mm a.on{background:var(--ac-soft);color:var(--ac)}
.mm .sep{height:1px;background:var(--line);margin:6px 0}
.mm .out{color:var(--bad)}
.shell.nosb{display:block;max-width:980px}.shell.nosb .side{display:none}
.side .out{display:block;width:100%;text-align:left;padding:9px 12px;border:0;background:none;border-radius:9px;color:var(--bad);font:inherit;font-weight:600;cursor:pointer;margin-top:10px}
.side .out:hover{background:var(--bad-soft)}
.pf{display:grid;grid-template-columns:140px 1fr;gap:10px 16px;margin:0}.pf dt{color:var(--muted);font-weight:600}.pf dd{margin:0;font-weight:700;word-break:break-all}
.rng{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:0 0 16px}

<script>
(function(){
"use strict";
var CFG=window.TATHWIR||{},API=String(CFG.api||"").trim(),KEY=API?"tathwir-live-v2":"tathwir-demo-v2";
var BLN=["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
var p2=function(n){return("0"+n).slice(-2)};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function today(){var d=new Date();return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())}
function fmtDay(s){var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(s||""));return m?(+m[3])+" "+BLN[+m[2]-1]+" "+m[1]:""}
function fmtAt(ts){var d=new Date(ts);return d.getDate()+" "+BLN[d.getMonth()]+" "+d.getFullYear()}
function dayOf(ts){var d=new Date(ts);return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())}
function monthOf(ts){var d=new Date(ts);return d.getFullYear()+"-"+p2(d.getMonth()+1)}
function isHttps(u){return /^https:\/\//i.test(String(u||""))}
function ytId(u){var m=String(u||"").match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/);return m?m[1]:""}
function firstName(n){return String(n||"").trim().split(/\s+/)[0]||"teman"}
function clone(o){return JSON.parse(JSON.stringify(o))}
function newId(list){var mx=0;list.forEach(function(x){if(x.id>mx)mx=x.id});return Math.max(Math.floor(Date.now()/1000),mx+1)}

/* ---------- data awal (mode demo) ---------- */
function demoWeeks(){return[
 {id:1,name:"Pekan 1",desc:"Contoh pekan. Ubah tema dan tambahkan pelajaran di menu Admin.",opens:"",due:"",min:{w:3,u:1,k:40},lessons:[
  {id:1,title:"Contoh pelajaran 1",url:"",dur:"",note:"Tautan video belum diisi. Pelajaran ini punya contoh pre-test dan post-test.",q:[
    {q:"Apa arti كِتَاب?",o:["buku","pena","meja","pintu"],a:0},
    {q:"Apa arti قَلَم?",o:["buku","pena","meja","pintu"],a:1}]},
  {id:2,title:"Contoh pelajaran 2",url:"",dur:"",note:"",q:[]},
  {id:3,title:"Contoh pelajaran 3",url:"",dur:"",note:"Contoh pelajaran tanpa uslub dan tanpa tes. Langkahnya diatur admin.",q:[],steps:{uslub:false,pre:false,post:false}}]},
 {id:2,name:"Pekan 2",desc:"Contoh pekan kedua.",opens:"",due:"",min:{w:3,u:1,k:40},lessons:[
  {id:1,title:"Contoh pelajaran 1",url:"",dur:"",note:"",q:[]},
  {id:2,title:"Contoh pelajaran 2",url:"",dur:"",note:"",q:[]}]}]}
function fresh(){return{weeks:API?[]:demoWeeks(),watched:{},drafts:{},subs:{},tests:{},queue:[],edit:{},owner:""}}
var S;try{S=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){S=null}
if(!S||!Array.isArray(S.weeks))S=fresh();
["watched","drafts","subs","tests","edit"].forEach(function(k){S[k]=S[k]||{}});S.queue=S.queue||[];
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var ME=null,ADMIN=null,ADM=null,ADMSUBS=null,admT=0,subT=0,CFGVER=null;
try{ME=JSON.parse(localStorage.getItem("tathwir-me")||"null")}catch(e){}
try{ADMIN=sessionStorage.getItem("tathwir-admin")}catch(e){}

/* ---------- server ---------- */
function api(b){
  if(!API)return Promise.resolve({ok:false,offline:true});
  return fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(b)})
    .then(function(r){return r.json()}).catch(function(){return{ok:false,net:true,error:"Tidak tersambung ke server."}});
}
var flushing=false,flushT=null;
function enqueue(it){
  if(!API||!ME)return;
  var k=it.action+":"+it.weekId+":"+(it.lessonId||0);
  S.queue=S.queue.filter(function(q){return q._k!==k});
  it._k=k;it.email=ME.email;S.queue.push(it);save();flush();
}
function flush(){
  if(flushing||!API||!S.queue.length)return;
  flushing=true;
  var it=S.queue[0];
  api(it).then(function(r){
    flushing=false;
    if(r.ok||(!r.net&&!r.offline)){S.queue.shift();if(!r.ok)toast(r.error||"Perubahan ditolak server.");save();flush()}
    else{clearTimeout(flushT);flushT=setTimeout(flush,15000)}
  });
}
function put(m,w,l,v){m[w]=m[w]||{};m[w][l]=v}
function reapply(){
  S.queue.forEach(function(q){
    if(q.action==="saveWatched")put(S.watched,q.weekId,q.lessonId,!!q.watched);
    if(q.action==="saveDraft"&&q.draft)put(S.drafts,q.weekId,q.lessonId,q.draft);
  });
}
function mergeServer(r){S.watched=r.watched||{};S.drafts=r.drafts||{};S.subs=r.subs||{};S.tests=r.tests||{};reapply()}
function same(a,b){return JSON.stringify(a)===JSON.stringify(b)}
function typing(){var a=document.activeElement;return !!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&document.getElementById("page").contains(a))}

/* ---------- pekan, pelajaran, status ---------- */
function wk(id){return S.weeks.filter(function(w){return w.id===+id})[0]}
function lsn(w,id){return((w&&w.lessons)||[]).filter(function(l){return l.id===+id})[0]}
function minOf(w){var m=w.min||{};function g(v,d){v=parseInt(v,10);return v>=0?v:d}return{w:g(m.w,3),u:g(m.u,1),k:g(m.k,40)}}
function nq(l){return(l.q||[]).length}
function isW(w,l){return!!(S.watched[w.id]&&S.watched[w.id][l.id])}
function subOf(w,l){return S.subs[w.id]&&S.subs[w.id][l.id]}
function tOf(w,l){return(S.tests[w.id]&&S.tests[w.id][l.id])||{}}
function wstate(w){
  var ls=w.lessons||[],t=today(),n=ls.filter(function(l){return subOf(w,l)}).length,any=ls.some(function(l){return isW(w,l)||subOf(w,l)});
  var locked=!!(w.opens&&t<w.opens),over=!!(w.due&&t>w.due),all=ls.length>0&&n===ls.length;
  var late=ls.some(function(l){var s=subOf(w,l);return s&&s.late});
  var key=locked?"locked":all?"sent":over?"over":(n>0||any)?"watching":"new";
  return{key:key,n:n,total:ls.length,all:all,locked:locked,over:over,late:late};
}
function stLabel(w,st){
  var m={locked:["","Dibuka "+fmtDay(w.opens)],sent:["ok",st.late?"Selesai, terlambat":"Selesai"],over:["bad","Lewat tenggat"],
    watching:["warn",st.n+" dari "+st.total+" pelajaran selesai"],"new":["","Belum mulai"]}[st.key];
  return'<span class="st '+m[0]+'">'+esc(m[1])+'</span>';
}
var STEPK=["video","mufradat","uslub","khulasoh","pre","post"];
var STEPN={video:"Video",mufradat:"Mufradat",uslub:"Uslub",khulasoh:"Khulasoh",pre:"Pre-test",post:"Post-test"};
function stp(l){var o=(l&&l.steps)||{},r={};STEPK.forEach(function(k){r[k]=o[k]!==false});return r}
function stNames(l){var st=stp(l),a=STEPK.filter(function(k){return st[k]});return a.length===STEPK.length?"Semua langkah":(a.length?a.map(function(k){return STEPN[k]}).join(", "):"Hanya tombol Selesai")}
function lstate(w,l){
  var sub=subOf(w,l),t=tOf(w,l),st=stp(l),q=nq(l)>0,preOn=st.pre&&q,postOn=st.post&&q,watched=isW(w,l);
  return{sub:sub,pre:t.pre,post:t.post,st:st,preOn:preOn,postOn:postOn,has:preOn||postOn,watched:watched,
    notes:st.mufradat||st.uslub||st.khulasoh,ready:(!preOn||!!t.pre)&&(!st.video||watched)};
}
function lLabel(w,l){
  var s=lstate(w,l);
  if(s.sub)return'<span class="st ok">'+(s.sub.late?"Selesai, terlambat":"Selesai")+'</span>';
  if(s.watched||s.pre||(S.drafts[w.id]&&S.drafts[w.id][l.id]))return'<span class="st warn">Sedang dikerjakan</span>';
  return'<span class="st">Belum mulai</span>';
}
/* ---------- draf dan syarat ---------- */
function bI(){return{ar:"",id:""}}function bF(){return{ar:"",mu:"",ms:"",id:""}}
function D(w,l){
  var d=(S.drafts[w]=S.drafts[w]||{})[l];
  if(!d)d=S.drafts[w][l]={isim:[bI()],fiil:[bF()],uslub:[bI()],khulasoh:""};
  if(!Array.isArray(d.isim)||!d.isim.length)d.isim=[bI()];
  if(!Array.isArray(d.fiil)||!d.fiil.length)d.fiil=[bF()];
  if(!Array.isArray(d.uslub)||!d.uslub.length)d.uslub=[bI()];
  if(typeof d.khulasoh!=="string")d.khulasoh="";
  return d;
}
function tr(v){return!!String(v||"").trim()}
function cnt(d){
  var ni=0,nf=0,nu=0,part=0;
  (d.isim||[]).forEach(function(r){var a=tr(r.ar),b=tr(r.id);if(a&&b)ni++;else if(a||b)part++});
  (d.fiil||[]).forEach(function(r){var k=[r.ar,r.mu,r.ms,r.id].filter(tr).length;if(k===4)nf++;else if(k>0)part++});
  (d.uslub||[]).forEach(function(r){if(tr(r.ar))nu++;else if(tr(r.id))part++});
  return{ni:ni,nf:nf,nw:ni+nf,nu:nu,nk:String(d.khulasoh||"").trim().length,part:part};
}
function mask(d,st){
  return{isim:st.mufradat?d.isim:[],fiil:st.mufradat?d.fiil:[],uslub:st.uslub?d.uslub:[],khulasoh:st.khulasoh?d.khulasoh:""};
}
function reqs(w,l,d){
  var s=lstate(w,l),st=s.st,c=cnt(mask(d,st)),m=minOf(w),a=[];
  if(st.mufradat)a.push({t:"Mufradat: "+c.nw+" dari minimal "+m.w+" (isim dan fi'il yang lengkap)",ok:c.nw>=m.w});
  if(st.uslub)a.push({t:"Uslub: "+c.nu+" dari minimal "+m.u,ok:c.nu>=m.u});
  if(st.khulasoh)a.push({t:"Khulasoh: "+c.nk+" dari minimal "+m.k+" karakter",ok:c.nk>=m.k});
  if(s.preOn)a.push({t:"Pre-test dikerjakan",ok:!!s.pre});
  if(s.postOn)a.push({t:"Post-test dikerjakan",ok:!!s.post});
  if(c.part)a.push({t:c.part+" isian belum lengkap (lengkapi semua kolomnya atau hapus)",ok:false});
  if(!a.length)a.push({t:"Tidak ada syarat tambahan untuk pelajaran ini",ok:true});
  return a;
}
function cleanData(d,st){
  var t=function(v){return String(v||"").trim()};
  return mask({isim:(d.isim||[]).map(function(r){return{ar:t(r.ar),id:t(r.id)}}).filter(function(r){return r.ar&&r.id}),
    fiil:(d.fiil||[]).map(function(r){return{ar:t(r.ar),mu:t(r.mu),ms:t(r.ms),id:t(r.id)}}).filter(function(r){return r.ar&&r.mu&&r.ms&&r.id}),
    uslub:(d.uslub||[]).map(function(r){return{ar:t(r.ar),id:t(r.id)}}).filter(function(r){return r.ar}),
    khulasoh:t(d.khulasoh)},st);
}
/* ---------- komponen tampilan ---------- */
function vbox(l){
  var id=ytId(l.url);
  if(id)return'<div class="vbox"><button class="vplay" data-act="play" data-yt="'+id+'" aria-label="Putar video"><img src="https://i.ytimg.com/vi/'+id+'/hqdefault.jpg" alt="" loading="lazy"><span class="tri"></span></button></div>';
  if(isHttps(l.url))return'<a class="vlink" href="'+esc(l.url)+'" target="_blank" rel="noopener noreferrer">Buka video di tab baru</a>';
  return'<div class="vbox empty"><span>Tautan video belum diisi</span></div>';
}
function rmBtn(sec,i,label){return'<button type="button" class="x" data-act="delrow" data-sec="'+sec+'" data-i="'+i+'" aria-label="Hapus '+label+'">×</button>'}
function fld(sec,i,k,v,max,ph,ar){return'data-sec="'+sec+'" data-i="'+i+'" data-k="'+k+'" maxlength="'+max+'"'+(ph?' placeholder="'+esc(ph)+'"':'')+(ar?' class="arf" dir="rtl" lang="ar"':'')+' '}
function entIsim(i,r){

   '<label>Arti atau penjelasan (boleh dikosongkan)<textarea rows="2" '+fld("uslub",i,"id",0,300,"")+'>'+esc(r.id)+'</textarea></label></div>';
}
function updReq(){}
function tbl(title,rows,cols,body){
  var h='<h3>'+esc(title)+'</h3>';
  if(!rows.length)return h+'<p class="none">Tidak ada.</p>';
  return h+'<div class="tb"><table><thead><tr><th class="no">No</th>'+cols.map(function(c){return'<th'+(c[1]?' class="arc"':'')+'>'+c[0]+'</th>'}).join("")+'</tr></thead><tbody>'+
    rows.map(function(r,i){return'<tr><td class="no">'+(i+1)+'</td>'+body(r)+'</tr>'}).join("")+'</tbody></table></div>';
}
function arTd(v){return'<td class="arc" dir="rtl" lang="ar">'+esc(v)+'</td>'}
function noteHTML(d,l,kh){
  var st=stp(l),h="";
  if(st.mufradat)h+='<h3 class="mf">Mufradat</h3>'+
   tbl("Isim",d.isim||[],[["Arti"],["Kata Arab",1]],function(r){return'<td>'+esc(r.id)+'</td>'+arTd(r.ar)})+

var TEST=null;
function testCard(w,l,kind){
  var s=lstate(w,l),r=kind==="pre"?s.pre:s.post,name=kind==="pre"?"Pre-test":"Post-test";
  var h='<section class="card sc"><h2>'+name+'</h2>';

    h+='<form id="testform" data-w="'+w.id+'" data-l="'+l.id+'" data-kind="'+kind+'"><p class="hint">Pilih satu jawaban untuk tiap soal. Tes ini hanya bisa dikerjakan sekali.</p>'+
     l.q.map(function(q,i){return'<div class="qq"><p>'+(i+1)+'. '+esc(q.q)+'</p>'+q.o.map(function(o,j){return'<label class="opt"><input type="radio" name="q'+i+'" value="'+j+'"><span>'+esc(o)+'</span></label>'}).join("")+'</div>'}).join("")+
     '<button class="btn" type="submit">Kirim jawaban</button> <button class="btn line" type="button" data-act="canceltest">Batal</button></form>';
  }else if(r)h+='<p><span class="st ok">Skor '+esc(tscore(r))+'</span></p>';
  else if(kind==="pre")h+='<p class="hint">'+(s.st.video?'Kerjakan sebelum menonton video.':'Kerjakan sebelum mulai menulis.')+'</p><button class="btn" data-act="starttest" data-kind="pre" data-w="'+w.id+'" data-l="'+l.id+'">Mulai pre-test</button>';
  else if(s.preOn&&!s.pre)h+='<div class="lock">Kerjakan pre-test dulu.</div>';
  else if(s.st.video&&!s.watched)h+='<div class="lock">Tonton videonya dulu.</div>';
  else h+='<p class="hint">Kerjakan setelah selesai belajar.</p><button class="btn" data-act="starttest" data-kind="post" data-w="'+w.id+'" data-l="'+l.id+'">Mulai post-test</button>';
  return h+'</section>';
}
function formCards(w,l){

function joinID(a){return a.length<2?a.join(""):a.slice(0,-1).join(", ")+" dan "+a[a.length-1]}
function pLesson(wid,lid){

  var st=wstate(w);

      '<div class="act">'+(locked?'<span class="st">Kerjakan pre-test dulu</span>':s.watched?'<span class="st ok">Sudah ditonton</span><button class="btn line sm" data-act="unwatch" data-w="'+w.id+'" data-l="'+l.id+'">Batalkan</button>':
        '<button class="btn" data-act="watch" data-w="'+w.id+'" data-l="'+l.id+'">Saya sudah menonton</button>')+
      (!locked&&isHttps(l.url)&&ytId(l.url)?'<a class="btn line sm" href="'+esc(l.url)+'" target="_blank" rel="noopener noreferrer">Buka di YouTube</a>':'')+'</div></section>';
  }else if(l.note)h+='<section class="card sc"><p class="hint" style="margin:0">'+esc(l.note)+'</p></section>';
  if(!s.ready){
    var names=[];if(sp.mufradat)names.push("mufradat");if(sp.uslub)names.push("uslub");if(sp.khulasoh)names.push("khulasoh");
    return h+'<div class="lock">'+((s.preOn&&!s.pre)?"Kerjakan pre-test dulu.":"Tonton videonya dulu.")+' '+(names.length?'Setelah itu kamu bisa menulis '+joinID(names)+' di sini.':'Setelah itu kamu bisa menekan Selesai.')+'</div>';
  }
  if(s.notes)h+=formCards(w,l);

  h+='<div class="act" style="margin-top:6px"><button class="btn" id="fbtn" data-act="finish" data-w="'+w.id+'" data-l="'+l.id+'">'+(edit?"Simpan perubahan":"Selesai")+'</button>'+
    (edit?'<button class="btn line" data-act="canceledit" data-w="'+w.id+'" data-l="'+l.id+'">Batal ubah</button>':'')+'</div>';
  return h;

function allEntries(){
  var out=[];
  S.weeks.forEach(function(w){(w.lessons||[]).forEach(function(l){
    var s=subOf(w,l);if(!s||!s.data)return;var b={w:w.id,wn:w.name,ln:l.title,at:s.at};
    (s.data.isim||[]).forEach(function(r){out.push({t:"Isim",ar:r.ar,id:r.id,w:b.w,wn:b.wn,ln:b.ln,at:b.at})});
    (s.data.fiil||[]).forEach(function(r){out.push({t:"Fi'il",ar:r.ar,mu:r.mu,ms:r.ms,id:r.id,w:b.w,wn:b.wn,ln:b.ln,at:b.at})});
    (s.data.uslub||[]).forEach(function(r){out.push({t:"Uslub",ar:r.ar,id:r.id,w:b.w,wn:b.wn,ln:b.ln,at:b.at})});
  })});
  return out;
}
var UI={q:"",t:""};
function arCell(e){return e.t==="Fi'il"?[e.ar,e.mu,e.ms].join(" \u2013 "):e.ar}
function kRows(){
  var q=UI.q.trim().toLowerCase(),fn=rangeFn(PR);
  var rows=allEntries().filter(function(e){return fn({id:e.w})&&(!UI.t||e.t===UI.t)&&(!q||(arCell(e)+" "+e.id).toLowerCase().indexOf(q)>=0)});
  if(!rows.length)return'<tr><td colspan="5" style="color:var(--muted)">Tidak ada yang cocok.</td></tr>';
  return rows.map(function(e){return'<tr><td class="arc" dir="rtl" lang="ar">'+esc(arCell(e))+'</td><td>'+esc(e.id)+'</td><td>'+esc(e.t)+'</td><td>'+esc(e.wn)+', '+esc(e.ln)+'</td><td>'+esc(fmtAt(e.at))+'</td></tr>'}).join("");
}
/* rentang pekan untuk perkembangan */
var PR={f:"",t:"",kh:false},AR={f:"",t:""};
function rangeFn(R){
  var ids=S.weeks.map(function(w){return w.id}),lo=R.f?ids.indexOf(+R.f):0,hi=R.t?ids.indexOf(+R.t):ids.length-1;
  if(lo<0)lo=0;if(hi<0)hi=ids.length-1;if(lo>hi){var x=lo;lo=hi;hi=x}
  return function(w){var k=ids.indexOf(w.id);return k>=lo&&k<=hi};
}
function rangeText(R){
  var ids=S.weeks.map(function(w){return w.id});
  if(!R.f&&!R.t)return"Semua pekan";
  var a=R.f?wk(R.f):S.weeks[0],b=R.t?wk(R.t):S.weeks[S.weeks.length-1];
  if(!a||!b)return"Semua pekan";
  var ia=ids.indexOf(a.id),ib=ids.indexOf(b.id);if(ia>ib){var t=a;a=b;b=t}
  return a.id===b.id?a.name:a.name+" sampai "+b.name;
}
function rangeSel(pre,R){
  var opt=function(v,first){return'<option value="">'+first+'</option>'+S.weeks.map(function(w){return'<option value="'+w.id+'"'+(String(v)===String(w.id)?" selected":"")+'>'+esc(w.name)+'</option>'}).join("")};
  return'<div class="rng"><label>Dari pekan<select id="'+pre+'f">'+opt(R.f,"Dari awal")+'</select></label><label>Sampai pekan<select id="'+pre+'t">'+opt(R.t,"Sampai terakhir")+'</select></label></div>';
}

  h+='<h3 class="sh3" style="margin:26px 0 8px">Daftar kosakata</h3><p class="hint">Kata yang berulang di pelajaran berbeda tetap dihitung.</p>'+

   '<select id="kt" aria-label="Jenis"><option value="">Semua jenis</option>'+["Isim","Fi'il","Uslub"].map(function(t){return'<option'+(UI.t===t?" selected":"")+'>'+t+'</option>'}).join("")+'</select></div>'+

    qPersist(QS,"Soal tersimpan.");return}
});
window.addEventListener("hashchange",function(){EDW=null;EDL=null;TEST=null;route();window.scrollTo(0,0)});
document.addEventListener("error",function(e){var t=e.target;if(t&&t.tagName==="IMG"&&t.parentNode&&t.parentNode.classList&&t.parentNode.classList.contains("vplay"))t.remove()},true);
/* ---------- mulai ---------- */
route();
if(API){
  api({action:"getConfig"}).then(function(r){if(r.ok){CFGVER=r.ver||0;if(Array.isArray(r.weeks)&&!same(r.weeks,S.weeks)){S.weeks=r.weeks;save()}if(!typing())rerender()}});
  if(ME&&!S.queue.length)api({action:"register",name:ME.name,email:ME.email}).then(function(r){if(r.ok){var old=JSON.stringify([S.watched,S.drafts,S.subs,S.tests]);mergeServer(r);save();if(old!==JSON.stringify([S.watched,S.drafts,S.subs,S.tests])&&!typing())rerender()}});
  flush();
}

  var pf=localStorage.getItem("tathwir-prefill");
  if(pf){localStorage.removeItem("tathwir-prefill");pf=JSON.parse(pf);if(pf&&pf.email)doRegister(pf.name||pf.email,pf.email)}
}catch(e){}
})();
